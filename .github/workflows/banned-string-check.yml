name: banned-string-check

# Intentionally no `paths:` filter (MR-03): this check exists to catch
# confidential content wherever it lands, including doc-only and
# _drafts/ diffs that other Domain workflows (structure-check,
# back-flow-rules) are filtered to skip. Narrowing this one by path would
# reopen the exact leak it is meant to close.
on:
  pull_request:

jobs:
  call:
    uses: <adopter-org>/organisationos-foundation/.github/workflows/banned-string-check.yml@v1  # pin to a released tag or commit SHA; bump via a two-approver Foundation PR that also rolls the tag
    with:
      foundation-repo: <adopter-org>/organisationos-foundation
      foundation-ref: main
